services:
  - type: web
    name: stockify
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 24
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@stockify.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: MONGODB_URI
        sync: false
